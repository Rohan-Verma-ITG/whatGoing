version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: chat-app-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-admin123}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: chat-app-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGODB_URL: ${MONGODB_URL:-mongodb://admin:admin123@mongodb:27017}
      MONGO_DATABASE: ${MONGO_DATABASE:-chat_app}
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-8000}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-long-random-string}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ALGORITHM: ${ALGORITHM:-HS256}
    depends_on:
      - mongodb
    ports:
      - "8000:8000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: chat-app-client
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:8000/ws/chat}
    depends_on:
      - server
    ports:
      - "5173:5173"

volumes:
  mongo_data:
